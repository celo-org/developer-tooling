name: Upload celocli executables

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit-ish of the developer-tooling repo that the celocli should be compiled and uploaded from'
        type: string
        required: true

  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit-ish of the developer-tooling repo that the celocli should be compiled and uploaded from'
        type: string
        required: true

jobs:
  setupVariables:
    name: Asserts and setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setupVars.outputs.version }}
      commit: ${{ steps.setupVars.outputs.commit }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 'enable corepack for yarn'
        run: sudo corepack enable yarn
        shell: bash
      # must call twice because of chicken and egg problem with yarn and node
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install Dependencies
        shell: bash
        run: yarn

      - id: setupVars
        name: Setup variables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Parse version from the package.json
          version=$(cat packages/cli/package.json | jq -r .version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Get the short commit from github release
          commit=$(gh release view @celo/celocli@$version --json tagName \
            | jq '.tagName' \
            | xargs git rev-list -n 1 --abbrev-commit)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          cat $GITHUB_OUTPUT

      - name: Assert stable release
        run: |
          ./scripts/assert_stable_version $TARBALL_VERSION
        env:
          TARBALL_VERSION: ${{ steps.setupVars.outputs.version }}
  compile:
    needs: [setupVariables]
    name: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-latest # arm
          - macos-latest-large # intel
    env:
      targets: |
        {
          \"ubuntu-latest\": [
            \"linux-x64\"
          ],
          \"ubuntu-24.04-arm\": [
            \"linux-arm\",
            \"linux-arm64\"
          ],
          \"macos-latest\": [
            \"darwin-arm64\"
          ],
          \"macos-latest-large\": [
            \"darwin-x64\"
          ],
          \"windows-latest\": [
            \"win32-arm64\",
            \"win32-x64\",
            \"win32-x86\"
          ]
        }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 'enable corepack for yarn'
        run: corepack enable yarn
        shell: bash
      # must call twice because of chicken and egg problem with yarn and node
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Install Dependencies
        shell: bash
        run: yarn

      - name: Upload executables on the github release
        working-directory: packages/cli
        shell: bash
        run: |
          # Download tarball from published release on NPM and save path
          tarballPath=/tmp/$(npm pack @celo/celocli@$version \
            --json \
            --pack-destination /tmp/ \
            | jq 'first.filename' -r)

          targets=$(echo "${{ env.targets }}" | jq -r '."${{ matrix.os }}" | join(",")')

          # Pack the tarballs from NPM into platform specific executables
          yarn oclif pack tarballs --tarball=$tarballPath --targets=$targets

          ls -la ./dist/
          gh release upload --clobber @celo/celocli@${{ needs.setupVariables.outputs.version }} ./dist/*.xz
        env:
          GH_TOKEN: ${{ github.token }}

  upload:
    needs: [setupVariables, compile]
    name: Build homebrew formula
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout + release download; no secrets in this job
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 'enable corepack for yarn'
        run: sudo corepack enable yarn
        shell: bash
      # must call twice because of chicken and egg problem with yarn and node
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Install Dependencies
        shell: bash
        run: yarn

      - name: Prepare the homebrew PR
        run: |
          # Fetch the platform-specific executables from github release
          gh release download -R celo-org/developer-tooling -D dist @celo/celocli@${{ needs.setupVariables.outputs.version }}

          # Run the package.json's homebrew script
          yarn run homebrew

          # Sanity checks
          ls dist
          cat ./homebrew/Formula/celocli.rb
        working-directory: packages/cli
        env:
          GITHUB_SHA_SHORT: ${{ needs.setupVariables.outputs.commit }}
          TARBALL_VERSION: ${{ needs.setupVariables.outputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: Homebrew tests
        working-directory: packages/cli
        run: |
          brew update
          brew cleanup
          ./homebrew/scripts/test.sh

      - name: Save the formula for the PR job
        uses: actions/upload-artifact@v7
        with:
          name: celocli-formula
          path: packages/cli/homebrew/Formula/celocli.rb
          if-no-files-found: error

  homebrew-pr:
    # Only job that sees the GitHub App key: runs no third-party code besides
    # the OpenBao and token actions.
    needs: [setupVariables, upload]
    name: Submit homebrew PR
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OpenBao login; the PR uses the GitHub App token
    steps:
      - name: Import GitHub App key from OpenBao
        id: openbao
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://openbao.akeyless.celo-networks-dev.org
          method: jwt
          path: github
          role: celo-org_developer-tooling_master
          exportEnv: false
          secrets: |
            secrets/data/static-secrets/dev-tooling-circle/github-app/developer-tooling-release app_id | APP_ID ;
            secrets/data/static-secrets/dev-tooling-circle/github-app/developer-tooling-release private_key | APP_PRIVATE_KEY

      - name: Create GitHub App token for celo-org/homebrew-brew
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.openbao.outputs.APP_ID }}
          private-key: ${{ steps.openbao.outputs.APP_PRIVATE_KEY }}
          owner: celo-org
          repositories: homebrew-brew
          permission-contents: write
          permission-pull-requests: write
          permission-members: read  # request celo-org/devtooling as reviewer

      - name: Checkout Celo Homebrew Tap
        uses: actions/checkout@v6
        with:
          repository: 'celo-org/homebrew-brew'
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Download the formula
        uses: actions/download-artifact@v8
        with:
          name: celocli-formula
          path: ${{ runner.temp }}/formula

      - name: Open pull-request on Homebrew repo
        env:
          BOT_NAME: 'celo-org'
          BOT_EMAIL: 'celo-org@github.com'
          BASE_BRANCH: main
          VERSION: ${{ needs.setupVariables.outputs.version }}
          NEW_BRANCH: 'ci/celocli-${{ needs.setupVariables.outputs.version }}'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_URL: 'https://github.com/celo-org/developer-tooling/releases/download/%40celo%2Fcelocli%40${{ needs.setupVariables.outputs.version }}'
        run: |
          set -x

          # Setup the committers identity.
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"

          # Create a new feature branch for the changes.
          git checkout -b "$NEW_BRANCH"
          cp "$RUNNER_TEMP/formula/celocli.rb" ./Formula/celocli.rb
          git add ./Formula/celocli.rb
          git diff --cached

          # Commit the new Formula
          git commit -m "celocli $VERSION"
          git push origin "$NEW_BRANCH" -f

          # Write the pull-request body into a file
          cat >/tmp/pr-body.md <<EOL
          Update celocli formula to [$VERSION]($RELEASE_URL).

          🤖 _This pull-request was opened by a robot beep boop from [@$BOT_NAME](https://github.com/celo-org)_ 🤖
          EOL

          # Open a pull-request
          gh pr create \
            --body-file /tmp/pr-body.md \
            --reviewer "celo-org/devtooling" \
            --title "celocli $VERSION" \
            --base "$BASE_BRANCH" \
            --head "$NEW_BRANCH"
